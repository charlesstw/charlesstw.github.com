<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>檢查 UserAgent 並隱藏元素</title>
</head>
<body>
    <h1>檢查 UserAgent 並隱藏元素</h1>
    <div id="hiddenDiv">這個 div 可能會被隱藏</div>    
    <script>                
        let userAgent = navigator.userAgent;
        if (userAgent == "app") {
            document.getElementById('hiddenDiv').style.display = 'none';
            console.log('user agent = app，div 已被隱藏');
        } else {
            console.log('user agent != app，div 不隱藏');        
        };
    </script>
</body>
</html>
